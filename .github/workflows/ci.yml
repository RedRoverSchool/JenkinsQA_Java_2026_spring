name: CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      run_all_tests:
        description: 'Run all tests'
        type: boolean
        default: true
      test_classes:
        description: 'Specific test classes (comma-separated, e.g. FreestyleProjectTest,FolderTest). Ignored if "Run all tests" is checked.'
        type: string
        required: false

jobs:
  run-test:
    name: 'Run tests'
    runs-on: ubuntu-latest
    steps:
      - name: Git clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'maven'

      - name: Get list of changed files
        if: github.event_name == 'pull_request'
        run: echo "LIST_OF_CHANGED_FILES=$(git diff --name-status $(git merge-base origin/$GITHUB_HEAD_REF origin/main) origin/$GITHUB_HEAD_REF | tr '\n' ';' | tr '\t' '=')" >> $GITHUB_ENV

      - name: Compile tests
        run: mvn test-compile

      - name: Get collections of class dependencies
        if: github.event_name == 'pull_request'
        run: echo "LIST_OF_DEPENDENCIES_CLASSES=$(jdeps -verbose:class -filter:none -recursive ./target/test-classes | grep "school.redrover.*-> school.redrover" | awk '{print $3 "=" $1}' | tr '\n' ';')" >> $GITHUB_ENV

# tar -cvf jenkins_backup.tar ./jenkins_backup
# split -b 95m -d jenkins_backup.tar jenkins_backup

# git submodule update --init --recursive
# git submodule update --remote _jenkins_data

      - name: Prepare Jenkins data
        run: |
          cat ${{ github.workspace }}/_jenkins_data/jenkins_backup* > ${{ github.workspace }}/jenkins_backup.tar
          md5sum ${{ github.workspace }}/jenkins_backup.tar

      - name: Extract Jenkins data and set permission
        run: |
          tar -xvf ./jenkins_backup.tar
          chmod -R 777 ./jenkins_backup/var/jenkins_home

      - name: Docker login
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Docker start
        run: docker run --rm --detach -p 8080:8080 -v ${{ github.workspace }}/jenkins_backup/var/jenkins_home:/var/jenkins_home jenkins/jenkins:2.541.3-lts-jdk25

      - name: Wait for the Jenkins
        run: ./.github/wait-for-jenkins.sh

      - name: Maven test
        run: |
          if [ "$RUN_ALL_TESTS" = "false" ] && [ -n "$TEST_CLASSES" ]; then
            mvn test -Dtest="$TEST_CLASSES"
          else
            mvn test
          fi
        env:
          RUN_ALL_TESTS: ${{ inputs.run_all_tests }}
          TEST_CLASSES: ${{ inputs.test_classes }}
          JENKINS_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          JENKINS_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JENKINS_HOST: localhost
          JENKINS_PORT: 8080
          BROWSER_NAME: chrome
          BROWSER_OPTIONS_CHROME: --remote-allow-origins=*;--disable-gpu;--no-sandbox;--disable-dev-shm-usage;--headless=new;--window-size=1920,1080
          RUN_CI: true

      - name: Add screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ github.workspace }}/screenshots

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Preserve history for trend graphs
        if: always()
        run: |
          mkdir -p target/allure-results/history
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history/. target/allure-results/history/
          fi

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline@2.42.0

      - name: Build Allure Report
        if: always()
        run: allure generate --clean target/allure-results -o allure-report

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
